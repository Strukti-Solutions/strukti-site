<!doctype html><html><head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="scene.js"></script>
<script>try{FDE.render(document.getElementById('c'),'portrait',{})}catch(e){document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;top:0;left:0;color:#fff;font:20px monospace;background:#900;white-space:pre-wrap;width:100%">'+e.stack+'</pre>')}</script>
</body></html>
