<!doctype html><html><head><meta charset="utf-8"><title>plates</title>
<style>html,body{margin:0;padding:0;width:2560px;height:1440px;overflow:hidden;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="2560" height="1440"></canvas>
<script src="scene.js"></script>
<script>try{const c=document.getElementById('c'),x=c.getContext('2d');
['A','B','C','D'].forEach((p,i)=>{const t=document.createElement('canvas');t.width=1280;t.height=720;FDE.render(t,'media',{pass:p});x.drawImage(t,(i%2)*1280,Math.floor(i/2)*720);});
}catch(e){document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;top:0;left:0;color:#fff;font:20px monospace;background:#900;white-space:pre-wrap;width:100%">'+e.stack+'</pre>')}</script>
</body></html>
